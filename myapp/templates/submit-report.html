<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  {% block content %}
  <div class="container">
      <h2>Submit Report for {{ patient.name }}</h2>
  
      {% if messages %}
          {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">{{ message }}</div>
          {% endfor %}
      {% endif %}
  
      <form method="POST">
          {% csrf_token %}
          
          <label for="diagnosis">Diagnosis:</label>
          <input type="text" name="diagnosis" class="form-control" required>
  
          <label for="prescription">Prescription:</label>
          <input type="text" name="prescription" class="form-control" required>
  
          <label for="notes">Notes:</label>
          <textarea name="notes" class="form-control" required></textarea>
  
          <button type="submit" class="btn btn-primary mt-3">Submit Report</button>
      </form>
  </div>
  {% endblock %}
</body>
</html>
