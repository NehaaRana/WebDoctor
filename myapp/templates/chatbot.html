



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .chat-container { width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        input, button { padding: 10px; width: 80%; margin: 10px 0; }
        button { background: blue; color: white; border: none; cursor: pointer; }
        .chat-box { text-align: left; max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #fff; }
        .user-message { color: blue; }
        .bot-message { color: green; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Medical Chatbot</h2>
        <div class="chat-box" id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Ask a medical question...">
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        function sendMessage() {
            let userInput = document.getElementById("user-input").value;
            let chatBox = document.getElementById("chat-box");
            if (userInput.trim() === "") return;
            chatBox.innerHTML += `<p class="user-message"><strong>You:</strong> ${userInput}</p>`;
            fetch(`/chat/?query=${encodeURIComponent(userInput)}`)
                .then(response => response.json())
                .then(data => {
                    chatBox.innerHTML += `<p class="bot-message"><strong>Bot:</strong> ${data.response}</p>`;
                    document.getElementById("user-input").value = "";
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>

<body>
    <div id="chat-container">
        <h2>Medical Chatbot</h2>
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Enter your symptom..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            let userInput = document.getElementById("user-input").value;
            let chatBox = document.getElementById("chat-box");

            chatBox.innerHTML += `<p><b>You:</b> ${userInput}</p>`;

            let formData = new FormData();
            formData.append("message", userInput);

            let response = await fetch("/chat/chatbot/", {
                method: "POST",
                body: formData
            });

            let data = await response.json();
            chatBox.innerHTML += `<p><b>Bot:</b> ${data.response}</p>`;

            document.getElementById("user-input").value = "";
        }
    </script>
