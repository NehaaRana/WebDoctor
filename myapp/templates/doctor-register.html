{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web doctor</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/img/favicon.png' %}" type="image/x-icon" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}" />


     {% comment %} alerts {% endcomment %}

    <!-- jQuery (Required for Toastr) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js" integrity="sha512-lbwH47l/tPXJYG9AcFNoJaTMhGvYWhVM9YI43CT+uteTRRaiLCui8snIgyAN8XWgNjNhCqlAUdzZptso6OCoFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- Toastr CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">

    <style>
        .custom-alert {
            background-color: #0e82fd;
            color: white;
            border-radius: 8px;
            font-size: 18px;
            padding: 15px;
            text-align: center;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 1000;
        }

        .register-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-box {
            display: flex;
            flex-wrap: wrap;
            max-width: 70rem;
            width: 100%;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .svg-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            padding: 20px;
        }

        .form-container {
            flex: 1;
            padding: 40px;
            background: linear-gradient(45deg,
                    rgb(33, 37, 240) -200%,
                    rgba(255, 255, 255, 1) 25%,
                    rgba(255, 255, 255, 1) 75%,
                    rgb(33, 37, 240) 200%);
        }

        .btn_register {
            position: relative;
            transition: all 0.3s ease-in-out;
            padding-block: 0.5rem;
            padding-inline: 1.25rem;
            background-color: #0e82fd;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            border: none;
            outline: none;
            border-radius: 7px;
            overflow: hidden;
            font-size: 15px;
            width: 100%;
        }

        .btn_register:hover::before {
            animation: shine 1.5s ease-out infinite;
        }

        .btn_register::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100%;
            background-image: linear-gradient(120deg,
                    rgba(255, 255, 255, 0) 30%,
                    rgba(255, 255, 255, 0.8),
                    rgba(255, 255, 255, 0) 70%);
            top: 0;
            left: -100px;
            opacity: 0.6;
        }

        @keyframes shine {
            0% {
                left: -100px;
            }

            60%,
            100% {
                left: 100%;
            }
        }

        .toast-success { background-color:rgba(84, 162, 102, 0.89) !important; color:black !important; border:2px solid green !important}
        .toast-error { background-color:rgba(210, 93, 105, 0.88) !important; color:black !important; border:2px solid red !important }
        .toast-warning { background-color:rgb(241, 216, 141)  !important; color:black !important; border:2px solid yellow !important}
        .toast-info { background-color:black !important; color:  #17a2b8 !important; }
    </style>
</head>

<body>
    <div class="main-wrapper">

        {% include 'header.html' %}


        {% comment %} alerts {% endcomment %}
<script>
    $(document).ready(function () {
        {% if messages %}
            {% for message in messages %}
                toastr.options = {
                    closeButton: true,
                    progressBar: true,
                    timeOut: 5000,  // 5 seconds
                };
                toastr["{{ message.tags }}"]("{{ message }}");
            {% endfor %}
        {% endif %}
    });
  </script>
  
        <div class="register-container">
            <div class="register-box">
                <div class="svg-container">
                    <img src="{% static 'assets/img/sign-up-animate.svg' %}" alt="Doctor Signup" class="img-fluid" />
                </div>

                <div class="form-container">
                    <div class="login-back">
                        <a href="/" class="text-dark"><i class="fa-solid fa-arrow-left-long text-dark"></i> Back</a>
                    </div>
                    <h2 class="text-center fw-bolder">Doctor Signup</h2>
                    <p class="text-center">
                        Join us and connect with patients seamlessly.
                    </p>
                    <form action="{% url 'doctor_register' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %} 
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Full Name</label>
                                <input type="text" name="name" class="form-control" id="name"
                                    placeholder="Enter Your Full Name" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Gender</label>
                                <select class="form-select form-control" name="gender" id="gender">
                                    <option value="">Select</option>
                                    <option value="M">Male</option>
                                    <option value="F">Female</option>
                                    <option value="O">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Qualification</label>
                                <input type="text" name="qualification" class="form-control" id="qualification"
                                    placeholder="Enter Qualification" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Specialization</label>
                                <input type="text" name="specialization" class="form-control" id="specialization"
                                    placeholder="Specialization" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" id="email"
                                    placeholder="abc@gmail.com" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Phone Number</label>
                                <input type="text" name="phno" class="form-control" id="phno"
                                    placeholder="Enter Phone Number" />
                            </div>
                            <div class="col-md-12 mb-3">
                                <label>Create Password</label>
                                <input type="password" name="password" class="form-control" id="password"
                                    placeholder="*************" />
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terms" />
                            <label class="form-check-label" for="terms">I agree to the Terms of Service</label>
                        </div>
                        <button type="submit" class="btn_register">
                            Sign Up &nbsp;&nbsp;<i class="fa-solid fa-user-plus"></i>
                        </button>
                        <p class="text-center mt-3">
                            Already a member?
                            <a href="{% url 'login' %}" class="fw-bolder text-secondary text-decoration-underline">Sign
                                in here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>

        <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>

        {% include 'footer.html' %}
    </div>
</body>

</html>
