{% load static %}
<html lang="en" style="transform: none;" class="fontawesome-i2svg-active fontawesome-i2svg-complete">
<head>
    <meta charset="utf-8">
    <title>webDoctor</title>
    <link rel="shortcut icon" href="{% static 'assets/img/favicon.png' %}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/feather.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}">
    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var output = document.getElementById('preview-img');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
    <style id="theia-sticky-sidebar-stylesheet-TSS">.theiaStickySidebar:after {content: ""; display: table; clear: both;}</style>
    <style type="text/css">@font-face { font-family: Roboto; src: url("chrome-extension://mcgbeeipkmelnpldkobichboakdfaeon/css/Roboto-Regular.ttf"); }</style>
</head>
<body style="transform: none;">
    <div class="main-wrapper" style="transform: none;">
        <div class="content" style="transform: none; min-height: 355.906px;">
            <div class="container" style="transform: none; padding-top:50px">
                <div class="row" style="transform: none;">
                    <div class="col-md-5 col-lg-4 col-xl-3 theiaStickySidebar" style="position: relative; overflow: visible; box-sizing: border-box; min-height: 1px;">
                        <div class="theiaStickySidebar" style="padding-top: 0px; padding-bottom: 1px; position: static; transform: none;">
                            <div class="profile-sidebar">
                                <div class="widget-profile pro-widget-content">
                                    <div class="profile-info-widget">
                                        <a href="#" class="booking-doc-img">
                                            <img src="{% static 'assets/img/' %}{{ profile }}" alt="User Image">
                                        </a>
                                        <div class="profile-det-info">
                                            <h3>{{ admin.name }}</h3>
                                            <div class="patient-details">
                                                <h5 class="mb-0">{{ admin.Qualification }} &amp; {{ admin.Job_Profile }}</h5>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="dashboard-widget">
                                    <nav class="dashboard-menu">
                                        <ul>
                                            <li><a href="{% url 'admin_dashboard' %}"><i class="fas fa-columns"></i> <span>Dashboard</span></a></li>
                                            <li class="active"><a href="{% url 'admin_profile_settings' %}"><i class="fas fa-user-cog"></i> <span>Profile Settings</span></a></li>
                                            <li><a href="{% url 'admin_manage_doctors' %}"><i class="fas fa-user-md"></i> <span>Manage Doctors</span></a></li>
                                            <li><a href="{% url 'admin_manage_patients' %}"><i class="fas fa-users"></i> <span>Manage Patients</span></a></li>
                                            <li><a href="{% url 'admin_manage_appointments' %}"><i class="fas fa-calendar-check"></i> <span>Manage Appointments</span></a></li>
                                            <li><a href="{% url 'admin_change_password' %}"><i class="fas fa-lock"></i> <span>Change Password</span></a></li>
                                            <li><a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-7 col-lg-8 col-xl-9">
                        <div class="card">
                            <div class="card-body">
                                <form method="POST" action="{% url 'admin_profile_settings' %}" enctype="multipart/form-data">
                                    {% csrf_token %}
                                    <div class="row form-row">
                                        <div class="col-md-12">
                                            <div class="form-group">
                                                <div class="change-avatar">
                                                    <div class="profile-img">
                                                        <img id="preview-img" alt="Profile Update" src="{% static 'assets/img/' %}{{ profile }}">
                                                    </div>
                                                    <div class="upload-img">
                                                        <div class="change-photo-btn">
                                                            <span><i class="fa fa-upload"></i> Upload Photo</span>
                                                            <input type="file" id="photo" name="photo" accept="image/*" class="upload" onchange="previewImage(event)">
                                                        </div>
                                                        <small class="form-text text-muted">Allowed JPG or PNG. Max size of 2MB</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Admin ID <span class="text-danger">*</span></label>
                                                <input type="text" class="form-control" value="{{ admin.id}}" readonly>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Email <span class="text-danger">*</span></label>
                                                <input type="email" id="email" name="email" class="form-control" value="{{ admin.email }}" readonly>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Full Name</label>
                                                <input type="text" class="form-control" id="name" name="name" value="{{ admin.name }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Phone</label>
                                                <input type="text" class="form-control" id="phone" name="phone" value="{{ admin.phone }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Qualification</label>
                                                <input type="text" class="form-control" id="qualification" name="qualification" value="{{ admin.qualification }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Job Profile</label>
                                                <input type="text" class="form-control" id="job" name="job" value="{{ admin.job_profile }}">
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label>Address</label>
                                                <input type="text" class="form-control" id="address" name="address" value="{{ admin.address }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>City</label>
                                                <input type="text" class="form-control" id="city" name="city" value="{{ admin.city }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>State</label>
                                                <input type="text" class="form-control" id="state" name="state" value="{{ admin.state }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Pin Code</label>
                                                <input type="text" class="form-control" id="pincode" name="pincode" value="{{ admin.pincode }}">
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-group">
                                                <label>Country</label>
                                                <input type="text" class="form-control" id="country" name="country" value="{{ admin.country }}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="submit-section">
                                        <button type="submit" class="btn btn-primary prime-btn">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
