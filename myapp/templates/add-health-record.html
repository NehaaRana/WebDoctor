{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebDoctor{% endblock %}</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jquery-confirm CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.css" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #3c9ee5;
            --secondary-color: #56d0b3;
            --accent-color: #4a1e9e;
            --light-bg: #f8fafc;
            --card-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .health-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: none;
            overflow: hidden;
        }

        .health-card .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-bottom: none;
            padding: 1.5rem;
        }

        .health-form label {
            font-weight: 500;
            color: #444;
            margin-bottom: 0.5rem;
        }

        .health-form .form-control {
            border-radius: 8px;
            padding: 0.7rem 1rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .health-form .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(60, 158, 229, 0.15);
        }

        .btn-health-save {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-health-save:hover {
            box-shadow: 0 4px 12px rgba(86, 208, 179, 0.3);
        }

        .health-icon {
            background: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 1rem;
            color: var(--primary-color);
        }

        .pulse-animation {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(60, 158, 229, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(60, 158, 229, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(60, 158, 229, 0);
            }
        }
    </style>
</head>

<body>

    {% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card health-card">
                    <div class="card-header d-flex align-items-center">
                        <div class="health-icon pulse-animation">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <h3 class="mb-0 fw-bold">Health Record</h3>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" id="healthRecordForm" class="health-form">
                            {% csrf_token %}


                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.bp_systolic.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-heart text-danger me-2"></i> Systolic BP
                                    </label>
                                    {{ form.bp_systolic }}
                                </div>
                            </div>

                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.bp_diastolic.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-heart-pulse text-danger me-2"></i> Diastolic BP
                                    </label>
                                    {{ form.bp_diastolic }}
                                </div>
                            </div>



                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.heart_rate.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-wave-square text-primary me-2"></i> Heart Rate
                                    </label>
                                    {{ form.heart_rate }}
                                </div>
                            </div>

                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.sugar_level.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-droplet text-warning me-2"></i> Sugar Level
                                    </label>
                                    {{ form.sugar_level }}
                                </div>
                            </div>



                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.steps_walked.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-person-walking text-success me-2"></i> Steps Walked
                                    </label>
                                    {{ form.steps_walked }}
                                </div>
                            </div>

                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.sleep_hours.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-moon text-info me-2"></i> Sleep Hours
                                    </label>
                                    {{ form.sleep_hours }}
                                </div>
                            </div>


                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-health-save btn-lg">
                                    <i class="fas fa-save me-2"></i> Save Record
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% endblock %}

    <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>
    <script>
        $(document).ready(function () {
            $(".health-form input").addClass("form-control");

            let alertShown = false;

            function showAlert(icon, message) {
                if (alertShown) return; // Prevent duplicate alerts
                alertShown = true;
                $.alert({
                    title: `<i class='fa-solid ${icon} fa-2x fa-beat-fade'></i>`,
                    content: `<span style="font-size: 15px;">${message}</span>`,
                    type: "blue",
                    theme: "modern",
                    onClose: function () {
                        alertShown = false; // Reset after closing
                    }
                });
            }

            // Handle Django messages once
            let delay = 500;
            {% for message in messages %}
            setTimeout(function () {
                showAlert(
                    "{% if 'success' in message.tags %}fa-circle-check{% elif 'warning' in message.tags %}fa-exclamation-triangle{% elif 'error' in message.tags %}fa-circle-xmark{% else %}fa-info-circle{% endif %}",
                    "{{ message|escape }}"
                );
            }, delay);
            delay += 1000;
            {% endfor %}

            // Prevent duplicate event bindings
            $("#healthRecordForm").off("submit").on("submit", function (e) {
                e.preventDefault();

                let valid = true;
                let fieldNames = {
                    "bp_systolic": "Systolic BP",
                    "bp_diastolic": "Diastolic BP",
                    "heart_rate": "Heart Rate",
                    "sugar_level": "Sugar Level",
                    "steps_walked": "Steps Walked",
                    "sleep_hours": "Sleep Hours"
                };

                // Frontend validation
                $(this).find("input, select, textarea").each(function () {
                    let fieldName = fieldNames[$(this).attr("name")] || $(this).attr("name");
                    let value = $(this).val().trim();
                    if (value === "" || value.toLowerCase() === "none") {
                        showAlert("fa-hospital-user", `${fieldName} is required.`);
                        $(this).focus();
                        valid = false;
                        return false;
                    }
                });

                if (!valid) return;

                // Backend validation via AJAX
                $.ajax({
                    type: "POST",
                    url: "{% url 'add_health_record' %}",
                    data: $(this).serialize(),
                    dataType: "json",
                    success: function (response) {
                        if (response.success) {
                            $.alert({
                                title: `<i class="fa-solid fa-circle-check fa-2x fa-beat-fade"></i>`,
                                content: `<span style="font-size: 15px;">${response.message}</span>`,
                                type: "green",
                                theme: "modern",
                                animation: "news",
                                onClose: function () {
                                    window.location.reload();
                                }
                            });
                        } else {
                            let errors = JSON.parse(response.errors);
                            for (let field in errors) {
                                showAlert("fa-exclamation-circle", `${errors[field][0].message}`);
                                break;
                            }
                        }
                    },
                    error: function () {
                        showAlert("fa-exclamation-triangle", "Something went wrong. Please try again.");
                    }
                });
            });
        });

    </script>
</body>

</html>
