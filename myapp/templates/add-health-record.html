<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebDoctor{% endblock %}</title>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Toastr.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #3c9ee5;
            --secondary-color: #56d0b3;
            --accent-color: #4a1e9e;
            --light-bg: #f8fafc;
            --card-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
        }
        
        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .health-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: none;
            overflow: hidden;
        }
        
        .health-card .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-bottom: none;
            padding: 1.5rem;
        }
        
        .health-form label {
            font-weight: 500;
            color: #444;
            margin-bottom: 0.5rem;
        }
        
        .health-form .form-control {
            border-radius: 8px;
            padding: 0.7rem 1rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        
        .health-form .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(60, 158, 229, 0.15);
        }
        
        .btn-health-save {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-health-save:hover {
            box-shadow: 0 4px 12px rgba(86, 208, 179, 0.3);
        }
        
        .health-icon {
            background: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 1rem;
            color: var(--primary-color);
        }
        
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(60, 158, 229, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(60, 158, 229, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(60, 158, 229, 0);
            }
        }
        
        .toast-success { 
            background-color: rgba(84, 162, 102, 0.95) !important; 
            color: white !important; 
            border-radius: 8px !important;
        }
        .toast-error { 
            background-color: rgba(210, 93, 105, 0.95) !important; 
            color: white !important; 
            border-radius: 8px !important; 
        }
    </style>
</head>
<body>

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-12">
            <div class="card health-card">
                <div class="card-header d-flex align-items-center">
                    <div class="health-icon pulse-animation">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <h3 class="mb-0 fw-bold">Health Record</h3>
                </div>
                <div class="card-body p-4">
                    <form method="post" id="healthRecordForm" class="health-form">
                        {% csrf_token %}
                        
                        
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.bp_systolic.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-heart text-danger me-2"></i> Systolic BP
                                    </label>
                                    {{ form.bp_systolic }}
                                </div>
                            </div>
                            
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.bp_diastolic.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-heart-pulse text-danger me-2"></i> Diastolic BP
                                    </label>
                                    {{ form.bp_diastolic }}
                                </div>
                            </div>
                        
                        
                        
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.heart_rate.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-wave-square text-primary me-2"></i> Heart Rate
                                    </label>
                                    {{ form.heart_rate }}
                                </div>
                            </div>
                            
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.sugar_level.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-droplet text-warning me-2"></i> Sugar Level
                                    </label>
                                    {{ form.sugar_level }}
                                </div>
                            </div>
                       
                        
                       
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.steps_walked.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-person-walking text-success me-2"></i> Steps Walked
                                    </label>
                                    {{ form.steps_walked }}
                                </div>
                            </div>
                            
                            <div class="col-md-12 mb-4">
                                <div class="form-group">
                                    <label for="{{ form.sleep_hours.id_for_label }}" class="d-flex align-items-center">
                                        <i class="fas fa-moon text-info me-2"></i> Sleep Hours
                                    </label>
                                    {{ form.sleep_hours }}
                                </div>
                            </div>
                       
                        
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-health-save btn-lg">
                                <i class="fas fa-save me-2"></i> Save Record
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>   

<script>
    $(document).ready(function() {
        // Add Bootstrap classes to all form inputs if not already there
        $(".health-form input").addClass("form-control");
        
        // Initialize toastr options
        toastr.options = {
            closeButton: true,
            progressBar: true,
            positionClass: "toast-top-right",
            timeOut: 5000,
            showDuration: "300",
            hideDuration: "1000",
            extendedTimeOut: "1000",
        };
    });

    document.getElementById("healthRecordForm").addEventListener("submit", function (e) {
        e.preventDefault();
        
        let formData = new FormData(this);
        
        // Show loading state on button
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
        submitBtn.disabled = true;
        
        fetch("{% url 'add_health_record' %}", {
            method: "POST",
            body: formData,
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                toastr.success("Your health record has been saved successfully!");
                
                // Optional: Clear form fields
                this.reset();
                
                // Redirect after a short delay
                setTimeout(() => {
                    location.reload();
                }, 2000);
            } else {
                toastr.error("Error: " + (data.error || "Failed to save record"));
            }
        })
        .catch(error => {
            console.error("Submission failed:", error);
            toastr.error("Something went wrong. Please try again.");
        })
        .finally(() => {
            // Restore button state
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });
    });
</script>
{% endblock %}

</body>
</html>
