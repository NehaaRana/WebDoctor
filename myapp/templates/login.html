{% load static %}
<html lang="en" class="fontawesome-i2svg-active fontawesome-i2svg-complete">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=0"
    />
    <title>{% block title %} webDocter {% endblock %}</title>

    <link
      rel="shortcut icon"
      href="{% static 'assets/img/favicon.png' %}"
      type="image/x-icon"
    />

    <!-- -------------------- social icons ----------------------- -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>

    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}"
    />

    <link rel="stylesheet" href="{% static 'assets/css/feather.css' %}" />

    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}" />

    <style type="text/css">
      @font-face {
        font-family: Roboto;
        src: url("{% static 'assets/fonts/Roboto-Regular.ttf' %}") format("truetype");
      }
    </style>
  </head>
  <body class="login-body">
    {% block content %}
    <div class="main-wrapper">
        <!-- Your page content goes here -->

    {% include "header.html" %}  

          <div class="login-content-info">
            <div class="container">
              <div class="row justify-content-center">
                <div class="col-lg-4 col-md-6">
                  <div class="account-content">
                    <div class="login-shapes">
                      <div class="shape-img-left">
                        <img src="{% static 'assets/img/shape-01.png' %}" alt="" />
                      </div>
                      <div class="shape-img-right">
                        <img src="{% static 'assets/img/shape-02.png' %}" alt="" />
                      </div>
                    </div>
                    <div class="account-info sign">
                      <div class="login-back">
                        <a href="/"><i class="fa-solid fa-arrow-left-long"></i> back</a>
                      </div>
                      <div class="login-title">
                        <h3>Sign in</h3>
                        <p>Caring for your health, every step.</p>
                        {% if error %}
                        <div class="error-message" style="padding-top: 12px">
                          {{ error }}
                        </div>
                        {% endif %}
                      </div>
                      <form action="/login/" method="POST">
                         {% csrf_token %}
                        <div class="form-group">
                          <label for="email">E-mail</label>
                          <input type="text" id="email" class="form-control" name="email" placeholder="example@email.com" required />
                        </div>
                        <div class="form-group">
                          <label for="user_type">User Type</label>
                          <select id="user_type" class="form-select form-control" name="user_type" required>
                            <option value="" selected disabled>Select</option>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            {% comment %} <option value="admin">Admin</option> {% endcomment %}
                          </select>
                        </div>
                        <div class="form-group">
                          <label for="password">Password</label>
                          <input type="password" id="password" class="form-control" name="password" placeholder="*************" required />
                        </div>
                        <div class="form-group">
                          <button class="btn btn-block" type="submit">Sign in</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>



          <!-- Your page content goes here -->

    {% include "footer.html" %}  
    {% endblock %}
  </body>
</html>
