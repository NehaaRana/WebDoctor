{% load static %}
<html lang="en" class="fontawesome-i2svg-active fontawesome-i2svg-complete">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=0"
    />
    <title>{% block title %} webDoctor {% endblock %}</title>
    <link
      rel="shortcut icon"
      href="{% static 'assets/img/favicon.png' %}"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <link
      rel="stylesheet"
      href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}"
    />

    <link rel="stylesheet" href="{% static 'assets/css/feather.css' %}" />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/bootstrap-datetimepicker.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/owl.carousel.min.css' %}"
    />
    <link rel="stylesheet" href="{% static 'assets/css/aos.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}" />

    <style type="text/css">
      @font-face {
        font-family: Roboto;
        src: url("{% static 'assets/fonts/Roboto-Regular.ttf' %}")
          format("truetype");
      }
    </style>

    {% comment %} <script type="text/javascript">
      {% block scripts %}
      (function (d, m) {
        var kommunicateSettings = {
          appId: "41097113a7c6c40a6937dec0a185db8c",
          popupWidget: true,
          automaticChatOpenOnNavigation: true,
        };
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.async = true;
        s.src = "https://widget.kommunicate.io/v2/kommunicate.app";
        var h = document.getElementsByTagName("head")[0];
        h.appendChild(s);
        window.kommunicate = m;
        m._globals = kommunicateSettings;
      })(document, window.kommunicate || {});
      /* NOTE : Use web server to view HTML files as real-time update will not work if you directly open the HTML file in the browser. */
      {% endblock %}
    </script> {% endcomment %}
  </head>
  <body data-aos-easing="ease" data-aos-duration="1200" data-aos-delay="0">
    {% block content %}

      <header class="header header-fixed header-one">
        <div class="container">
          <nav class="navbar navbar-expand-lg header-nav">
            <div class="navbar-header">
              <a id="mobile_btn" href="javascript:void(0);">
                <span class="bar-icon">
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
              </a>
              <a href="{% url 'home' %}" class="navbar-brand logo">
                <img
                  src="{% static 'assets/img/logo.png' %}"
                  class="img-fluid"
                  alt="Logo"
                />
              </a>
            </div>
            <div class="main-menu-wrapper">
              <div class="menu-header">
                <a href="{% url 'home' %}" class="menu-logo">
                  <img
                    src="{% static 'assets/img/logo.png' %}"
                    class="img-fluid"
                    alt="Logo"
                  />
                </a>
                <a
                  id="menu_close"
                  class="menu-close"
                  href="javascript:void(0);"
                >
                  <svg
                    class="svg-inline--fa fa-times fa-w-11"
                    aria-hidden="true"
                    focusable="false"
                    data-prefix="fas"
                    data-icon="times"
                    role="img"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 352 512"
                    data-fa-i2svg=""
                  >
                    <path
                      fill="currentColor"
                      d="M242.72 256l100.07-100.07c12.28-12.28 12.28-32.19 0-44.48l-22.24-22.24c-12.28-12.28-32.19-12.28-44.48 0L176 189.28 75.93 89.21c-12.28-12.28-32.19-12.28-44.48 0L9.21 111.45c-12.28 12.28-12.28 32.19 0 44.48L109.28 256 9.21 356.07c-12.28 12.28-12.28 32.19 0 44.48l22.24 22.24c12.28 12.28 32.2 12.28 44.48 0L176 322.72l100.07 100.07c12.28 12.28 32.2 12.28 44.48 0l22.24-22.24c12.28-12.28 12.28-32.19 0-44.48L242.72 256z"
                    ></path>
                  </svg>
                </a>
              </div>
              <ul class="main-nav">
                <li class="active">
                  <a href="{% url 'home' %}">Home</a>
                </li>
                <li>
                  <a href="{% url 'about_us' %}">About Us</a>
                </li>
                <li>
                  <a href="{% url 'contact' %}">Contact Us</a>
                </li>

                <li class="phone_login">
                  <a href="{% url 'register' %}">Register</a>
                </li>
                <li class="phone_login">
                  <a href="{% url 'login' %}">Login</a>
                </li>

                <li class="register-btn">
                  <a href="{% url 'register' %}" class="btn reg-btn">
                    <i class="feather-user"></i>Register
                  </a>
                </li>
                <li class="register-btn">
                  <a href="{% url 'login' %}" class="btn btn-primary log-btn">
                    <i class="feather-lock"></i>Login
                  </a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </header>
  
    {% endblock %}
  </body>
</html>
