{% load static %} <!-- Load static files in Django -->

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
  <title>PMS</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="{% static 'assets/img/favicon.png' %}" type="image/x-icon">

  <!-- -------------------- Social Icons ----------------------- -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">

  <!-- FontAwesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">

  <!-- Feather Icons -->
  <link rel="stylesheet" href="{% static 'assets/css/feather.css' %}">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}">
</head>

<body class="login-body">

  <div class="main-wrapper">
    {% block content %}
    {% include "header.html" %}

    <div class="login-content-info">

      <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="account-content">
                    <div class="login-shapes">
                        <div class="shape-img-left">
                            <img src="{% static 'assets/img/shape-01.png' %}" alt="">
                        </div>
                        <div class="shape-img-right">
                            <img src="{% static 'assets/img/shape-02.png' %}" alt="">
                        </div>
                    </div>
                    <div class="account-info patient-reg">
                        <div class="login-back">
                            <a href="{% url 'register' %}"><i class="fa-solid fa-arrow-left-long"></i> Back</a>
                        </div>
                        <div class="login-title">
                            <h3>Patient Signup</h3>
                            <p class="mb-0">Welcome back! Please enter your details.</p>
    
                            <!-- Error message -->
                            {% if error %}
                            <div class="error-message" style="padding-top:12px">{{ error }}</div>
                            {% endif %}
                        </div>
    
                        <form method="POST" action="{% url 'patient_register' %}">
                            {% csrf_token %}
                            {{ form.non_field_errors }}
                            <div class="form-group">
                                <label>Full Name</label>
                                <input name="name" type="text" class="form-control" placeholder="Enter Your Full Name" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input name="email" type="email" class="form-control" placeholder="example@email.com" required>
                            </div>
    
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input name="phno" class="form-control form-control-lg group_formcontrol form-control-phone" id="phone" type="text" required>
                            </div>
    
                            <div class="form-group">
                                <label>Create Password</label>
                                <input name="password" class="form-control form-control-lg group_formcontrol form-control-phone" id="password" type="password" required>
                            </div>
    
                            <div class="form-group form-check-box terms-check-box">
                                <div class="form-group-flex">
                                    <label class="custom_check">
                                        I have read and agree to PMS <a href="{% url 'terms_condition' %}">Terms of Service</a>
                                        <input type="checkbox" name="Terms" required>
                                        <span class="checkmark"></span>
                                    </label>
                                </div>
                            </div>
    
                            <div class="form-group">
                                <button class="btn btn-block" type="submit">Create an Account</button>
                            </div>
    
                            <div class="account-signup">
                                <p>Already a Member? <a href="{% url 'login' %}">Sign in</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% include "footer.html" %}
{% endblock %}
    <div></div>
</body>

</html>
