{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PMS</title>
    <link rel="shortcut icon" href="{% static 'assets/img/favicon.png' %}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">

    <!-- CSS Files -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/feather.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}">

    <!-- FontAwesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>

    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function () {
                var previewImg = document.getElementById('preview-img');
                previewImg.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

</head>
<body class="login-body">
  <div class="main-wrapper">
  
      <!-- Header Section -->
      {% include "header.html" %}
  

      <div class="content" style="transform: none; min-height: 385.906px;">
        <div class="container" style="transform: none; padding-top:50px">
            <div class="row" style="transform: none;">
                <div class="col-md-5 col-lg-4 col-xl-3 theiaStickySidebar" style="position: relative; overflow: visible; box-sizing: border-box; min-height: 1px;">
                    <div class="theiaStickySidebar" style="padding-top: 0px; padding-bottom: 1px; position: static; transform: none;">
                        <div class="profile-sidebar">
                            <div class="widget-profile pro-widget-content">
                                <div class="profile-info-widget">
                                    <a href="#" class="booking-doc-img">
                                        <img src="{% static 'assets/img/' %}{{ profile }}" alt="profile">
                                    </a>
                                    <div class="profile-det-info">
                                        <h3>Dr. {{ doctor_data.Name }}</h3>
                                        <div class="patient-details">
                                            <h5 class="mb-0">{{ doctor_data.Qualification }} &amp; {{ doctor_data.Specialization }}</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
    
                            <div class="dashboard-widget">
                                <nav class="dashboard-menu">
                                    <ul>
                                        <li>
                                            <a href="{% url 'doctor_dashboard' %}">
                                                <i class="fas fa-columns"></i>
                                                <span>Dashboard</span>
                                            </a>
                                        </li>
    
                                        <li class="active">
                                            <a href="{% url 'doctor_profile_settings' %}">
                                                <i class="fas fa-user-cog"></i>
                                                <span>Profile Settings</span>
                                            </a>
                                        </li>
    
                                        <li>
                                            <a href="{% url 'doctor_change_password' %}">
                                                <i class="fas fa-lock"></i>
                                                <span>Change Password</span>
                                            </a>
                                        </li>
    
                                        <li>
                                            <a href="{% url 'logout' %}">
                                                <i class="fas fa-sign-out-alt"></i>
                                                <span>Logout</span>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>  
            </div>
        </div>
    </div>
    

{% include "footer.html" %}

</body>
</html>
