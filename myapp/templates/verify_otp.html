{% load static %}
<html>
<head>
    <title> {% block title %}
        WebDoctor
        {% endblock %}</title>
    <!-- jQuery (Required for Toastr & Bootstrap Modal) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    {% comment %} fontawesome {% endcomment %}
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- Bootstrap (For Modal) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery library (required for jquery-confirm) -->
    <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>

<!-- alert for otp sending -->
<script>
  $(document).ready(function () {
    function showAlert(icon, message) {
      $.alert({
        title: `<i class="fa-solid ${icon} fa-2x fa-beat-fade"></i>`,
        content: `<span style="font-size: 15px;">${message}</span>`,
        type: "blue",
        theme: "modern",
        buttons: {
          ok: {
            text: "OK",
            btnClass: "btn-blue",
          },
        },
      });
    }

    let delay = 500;
    {% if messages %}
      {% for message in messages %}
        setTimeout(function () {
          showAlert(
            "{% if 'success' in message.tags %}fa-circle-check{% elif 'warning' in message.tags %}fa-exclamation-triangle{% elif 'error' in message.tags %}fa-circle-xmark{% else %}fa-info-circle{% endif %}",
            "{{ message|escapejs }}"
          );
        }, delay);
        delay += 1000;
      {% endfor %}
    {% endif %}
  });
</script>

    
</head>
<body>

{% block content %}
<div class="container">
    
  

    <!-- Bootstrap Modal for OTP Verification -->
    <div class="modal fade" id="otpModal" tabindex="-1" aria-labelledby="otpModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="otpModalLabel">Verify Your Email</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-center">An OTP has been sent to <b>{{ email }}</b>. Please enter it below to verify.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Enter OTP</label>
                            <input type="text" name="otp" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-primary">Verify OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

<!-- jQuery library (required for jquery-confirm) -->
<script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>

<!-- alert for otp sending -->
<script>
$(document).ready(function () {
function showAlert(icon, message) {
   $.alert({
     title: `<i class="fa-solid ${icon} fa-2x fa-beat-fade"></i>`,
     content: `<span style="font-size: 15px;">${message}</span>`,
     type: "blue",
     theme: "modern",
     buttons: {
       ok: {
         text: "OK",
         btnClass: "btn-blue",
       },
     },
   });
 }
 let delay = 500; // Start with a small delay
 {% for message in messages %}
 setTimeout(function () {
   showAlert(
     "{% if 'success' in message.tags %}fa-circle-check{% elif 'warning' in message.tags %}fa-exclamation-triangle{% elif 'error' in message.tags %}fa-circle-xmark{% else %}fa-info-circle{% endif %}",
     "{{ message|escape }}",
     "{{ message.tags }}"
   );
 }, delay);
 delay += 1000; // Increase delay for next message
 {% endfor %}
 $("#otpModal").modal("show");
})

</script>

</body>
</html>
